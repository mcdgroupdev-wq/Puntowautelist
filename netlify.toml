[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/privacidad"
  to = "https://punto-legal.netlify.app/privacidad"
  status = 200
  force = true

[[redirects]]
  from = "/terminos"
  to = "https://punto-legal.netlify.app/terminos"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

